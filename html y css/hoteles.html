<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteles - Mountain Escape El Salvador</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="hoteles.css">
</head>
<body>

    <div class="page-container">
        
        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-mountain logo-icon"></i>
                <div class="logo-text">
                    <span class="brand-title">MOUNTAIN ESCAPE</span>
                    <span class="brand-sub">EL SALVADOR</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="destino.html" class="active">Destino</a>
                <a href="cabañas.html">Cabañas</a>
                <a href="iglus.html">Iglus</a>

                <a href="galeria.html">Galeria</a>

        </header>

        <section class="hero-section">
            <div class="hero-bg-placeholder">
                <h1 class="hero-title">hoteles</h1>
            </div>
        </section>

        <main class="catalog-section">
            <div class="cards-grid">

                <div class="card">
                    <div class="img-placeholder1"></div>
                    <div class="price-tag">
                        <span class="price-label">Precio</span>
                        <span class="price-amount">$50</span>
                        <span class="price-period">por 1 noche</span>
                    </div>
                </div>

                <div class="card">
                    <div class="img-placeholder2"></div>
                    <div class="price-tag">
                        <span class="price-label">Precio</span>
                        <span class="price-amount">$89</span>
                        <span class="price-period">por 1 noche</span>
                    </div>
                </div>

                <div class="card">
                    <div class="img-placeholder3"></div>
                    <div class="price-tag">
                        <span class="price-label">Precio</span>
                        <span class="price-amount">$94</span>
                        <span class="price-period">por 1 noche</span>
                    </div>
                </div>

                <div class="card">
                    <div class="img-placeholder4"></div>
                    <div class="price-tag">
                        <span class="price-label">Precio</span>
                        <span class="price-amount">$120</span>
                        <span class="price-period">por 1 noche</span>
                    </div>
                </div>

                <div class="card">
                    <div class="img-placeholder5"></div>
                    <div class="price-tag">
                        <span class="price-label">Precio</span>
                        <span class="price-amount">$99</span>
                        <span class="price-period">por 1 noche</span>
                    </div>
                </div>

                <div class="card">
                    <div class="img-placeholder6"></div>
                    <div class="price-tag">
                        <span class="price-label">Precio</span>
                        <span class="price-amount">$200</span>
                        <span class="price-period">por 1 noche</span>
                    </div>
                </div>

            </div>
        </main>

        <footer class="footer">
            <div class="footer-left">
                <div class="footer-logo">
                    <i class="fa-solid fa-mountain"></i>
                </div>
            </div>
            
            <div class="footer-center">
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>+503 1234 5678</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>info@mountainescape.sv</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>El Salvador centroamerica</span>

            <div class="footer-right">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>

                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
