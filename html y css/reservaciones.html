<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservaciones - Mountain Escape El Salvador</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="reservaciones.css">
</head>
<body>

    <div class="page-container">
        
        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-mountain logo-icon"></i>
                <div class="logo-text">
                    <span class="brand-title">MOUNTAIN ESCAPE</span>
                    <span class="brand-sub">EL SALVADOR</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="destino.html" class="active">Destino</a>
                <a href="cabañas.html">Cabañas</a>
                <a href="iglus.html">Iglus</a>
                <a href="hoteles.html">Hoteles</a>
                <a href="galeria.html">Galeria</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </header>

        <section class="hero-section">
            <div class="hero-bg-placeholder">
                <h1 class="hero-title">RESERVACIONES</h1>
            </div>
        </section>

        <main class="reservation-section">
            <form class="reservation-form" onsubmit="return false;">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Datos personales</label>
                        <input type="text" id="nombre" placeholder="Tu nombre">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electronico</label>
                        <input type="email" id="email" placeholder=".Com">
                    </div>

                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="tel" id="telefono" placeholder="Tu telefono">
                    </div>

                    <div class="form-group">
                        <label for="entrada">Fecha de entada</label>
                        <input type="date" id="entrada">
                    </div>

                    <div class="form-group">
                        <label for="salida">Fecha de salida</label>
                        <input type="date" id="salida">
                    </div>

                    <div class="form-group">
                        <label for="huespedes">Hoespedes</label>
                        <input type="number" id="huespedes" min="1" placeholder="Número de personas">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="comentarios">Comentarios adicionales(opcional)</label>
                    <textarea id="comentarios" rows="5"></textarea>
                </div>

                <div class="form-submit">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>

            </form>
        </main>

        <footer class="footer">
            <div class="footer-left">
                <div class="footer-logo">
                    <i class="fa-solid fa-mountain"></i>
                </div>
            </div>
            
            <div class="footer-center">
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>+503 1234 5678</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>info@mountainescape.sv</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>El Salvador centroamerica</span>
                </div>
            </div>

            <div class="footer-right">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </footer>

    </div>

</body>
</html>
